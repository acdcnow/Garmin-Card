name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install the test dependencies
        run: npm install

      - name: Run the smoke test
        run: npm test
