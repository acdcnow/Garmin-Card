# Design: dense rings
#
# Six rings in a three column grid with smaller rings. Good for a small
# section tile where you want a lot of values in little space.
type: custom:garmin-card
header: false
layout: rings
columns: 3
ring_size: 34
entities:
  - entity: sensor.garmin_connect_sleep_score
    name: Sleep
    max: 100
  - entity: sensor.garmin_connect_training_readiness
    name: Ready
    max: 100
  - entity: sensor.garmin_connect_body_battery
    name: Battery
    max: 100
  - entity: sensor.garmin_connect_average_stress_level
    name: Stress
    max: 100
  - entity: sensor.garmin_connect_latest_spo2
    name: SpO2
    max: 100
  - entity: sensor.garmin_connect_hrv_last_night_average
    name: HRV
    max: 100
